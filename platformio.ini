[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
; PIOArduino's hybrid builder recompiles ESP-IDF and ESP-Matter from source
; with these product-specific settings. Plain -D flags cannot change the
; memory layout of the precompiled framework archives.
custom_sdkconfig = file://sdkconfig.memory
build_flags =
  -DFASTLED_RMT5_DISABLE_WORKER_POOL
  ; PIOArduino's hybrid build copies the custom IDF libraries and generated
  ; sections, but retains the upstream PSRAM-enabled linker response file.
  ; Restore classic ESP32 ROM libc bindings so early flash initialization can
  ; call memset/memcpy while the instruction cache is disabled.
  -Wl,-Tesp32.rom.libc-funcs.ld
lib_deps =
  fastled/FastLED
monitor_speed = 115200
upload_protocol = esptool
